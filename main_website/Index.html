<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VilotGRI | Workspace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        /* =========================================
           VILOTGRI PREMIUM DESIGN SYSTEM
           ========================================= */
        :root {
            /* VilotGRI Brand Colors */
            --brand-primary: #6366f1; /* Indigo */
            --brand-secondary: #8b5cf6; /* Violet */
            --brand-accent: #f43f5e; /* Rose */
            
            /* Custom Brand Gradient */
            --vilotni-gradient: linear-gradient(135deg, var(--brand-primary), var(--brand-secondary), var(--brand-accent));
            
            /* Dark Mode Defaults */
            --bg-base: #09090b;
            --bg-surface: #18181b;
            --bg-sidebar: #09090b;
            --bg-elevated: #27272a;
            --bg-glass: rgba(9, 9, 11, 0.85);
            
            --text-primary: #fafafa;
            --text-secondary: #a1a1aa;
            --text-tertiary: #71717a;
            
            --border-subtle: #27272a;
            --border-highlight: #3f3f46;
            
            /* Soft, Premium Shadows */
            --shadow-elevation-1: 0 4px 6px -1px rgba(0, 0, 0, 0.3), 0 2px 4px -1px rgba(0, 0, 0, 0.2);
            --shadow-elevation-3: 0 20px 25px -5px rgba(0, 0, 0, 0.4), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
        }

        .light-mode {
            /* Light Mode */
            --bg-base: #fafafa;
            --bg-surface: #ffffff;
            --bg-sidebar: #f4f4f5;
            --bg-elevated: #f4f4f5;
            --bg-glass: rgba(255, 255, 255, 0.95);
            
            --text-primary: #09090b;
            --text-secondary: #52525b;
            --text-tertiary: #a1a1aa;
            
            --border-subtle: #e4e4e7;
            --border-highlight: #d4d4d8;
            
            --shadow-elevation-1: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            --shadow-elevation-3: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        /* Base Resets & Layout */
        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        h1, h2, h3, .font-display { font-family: 'Outfit', sans-serif; letter-spacing: -0.02em; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }

        .special-vilotni-text {
            background: var(--vilotni-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 700;
        }

        /* Structural Elements */
        #app-container { display: flex; height: 100vh; width: 100vw; position: relative; }
        #main-content { flex: 1; display: flex; flex-direction: column; position: relative; z-index: 10; min-width: 0; }
        
        .sidebar { 
            background-color: var(--bg-sidebar); 
            border-right: 1px solid var(--border-subtle); 
            z-index: 40; 
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1), transform 0.3s ease; 
            width: 260px;
        }
        .sidebar.collapsed { width: 0; border-right: none; overflow: hidden; }
        
        .glass-header { 
            background-color: var(--bg-glass); 
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-subtle); 
            z-index: 30; 
        }

        /* Floating Input Bar */
        .input-box {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            box-shadow: var(--shadow-elevation-3);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 1.5rem;
        }
        .input-box:focus-within { 
            border-color: var(--brand-primary); 
            box-shadow: 0 15px 50px -10px rgba(99, 102, 241, 0.15); 
            transform: translateY(-2px); 
        }

        /* Suggestion Cards */
        .suggestion-card { 
            background: var(--bg-surface); 
            border: 1px solid var(--border-subtle); 
            box-shadow: var(--shadow-elevation-1);
            transition: all 0.3s ease; 
        }
        .suggestion-card:hover { 
            background: var(--bg-elevated); 
            border-color: var(--border-highlight); 
            transform: translateY(-2px);
            box-shadow: var(--shadow-elevation-3);
        }

        textarea { resize: none; scrollbar-width: none; }
        textarea::-webkit-scrollbar { display: none; }

        @media (max-width: 768px) {
            .sidebar { position: absolute; height: 100%; transform: translateX(-100%); width: 280px; }
            .sidebar.open { transform: translateX(0); }
            .sidebar.collapsed { width: 280px; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeIn 0.4s cubic-bezier(0.25, 1, 0.5, 1) forwards; }

        /* Typing Indicator */
        .typing-indicator span {
            display: inline-block; width: 5px; height: 5px; background-color: var(--text-secondary);
            border-radius: 50%; margin-right: 4px; animation: typing 1.4s infinite ease-in-out both;
        }
        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes typing { 0%, 80%, 100% { transform: scale(0); opacity: 0.5; } 40% { transform: scale(1); opacity: 1; } }
        
        /* Custom Animated Thinking Ring */
        .progress-ring {
            transition: stroke-dashoffset 0.6s ease-in-out;
        }
        
        /* Chat Feed Formatting */
        .msg-user { 
            background: var(--text-primary); 
            color: var(--bg-base); 
            font-weight: 500;
        }
        
        /* Premium IDE Code Block */
        .code-window { 
            background: #09090b; 
            border: 1px solid var(--border-highlight); 
            border-radius: 1rem; 
            overflow: hidden; 
            margin-top: 1.5rem; 
            margin-bottom: 1.5rem; 
            box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
        }
        .code-window:hover {
            border-color: var(--brand-secondary);
            box-shadow: 0 10px 40px -10px rgba(99, 102, 241, 0.15);
        }
        .code-header { 
            background: #18181b; 
            border-bottom: 1px solid var(--border-subtle); 
            padding: 0.5rem 1rem; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }
        .code-content { 
            padding: 1.5rem; 
            overflow-x: auto; 
            font-size: 0.85rem; 
            line-height: 1.7; 
            color: #d4d4d8;
        }

        /* Syntax Highlighting Colors (Modern Style) */
        .token-tag { color: var(--brand-accent); font-weight: 500; }      
        .token-attr { color: var(--brand-secondary); }     
        .token-string { color: #10b981; }   
        
        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-subtle); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--border-highlight); }
    </style>
</head>
<body>

    <div id="app-container">
        
        <!-- Sidebar -->
        <aside id="sidebar" class="sidebar flex flex-col flex-shrink-0 relative">
            <div class="h-16 flex items-center px-6 border-b border-[var(--border-subtle)] justify-between min-w-[260px]">
                <div class="flex items-center space-x-3 text-[var(--text-primary)] cursor-pointer">
                    <!-- Updated Layered Architecture Icon -->
                    <div class="w-8 h-8 rounded-xl bg-gradient-to-br from-[var(--brand-primary)] to-[var(--brand-secondary)] flex items-center justify-center shadow-lg">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="white" stroke-width="2" stroke-linejoin="round"/>
                            <path d="M2 17L12 22L22 17" stroke="white" stroke-width="2" stroke-linejoin="round"/>
                            <path d="M2 12L12 17L22 12" stroke="white" stroke-width="2" stroke-linejoin="round"/>
                        </svg>
                    </div>
                    <span class="font-display font-bold text-lg tracking-tight">VilotGRI</span>
                </div>
                <button class="hidden md:block p-1.5 text-[var(--text-secondary)] hover:text-[var(--text-primary)] transition-colors rounded-md hover:bg-[var(--bg-elevated)]" onclick="toggleDesktopSidebar()" title="Close Sidebar">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 19l-7-7 7-7m8 14l-7-7 7-7" /></svg>
                </button>
            </div>

            <div class="p-4 min-w-[260px]">
                <button class="w-full py-2.5 px-3 rounded-xl border border-[var(--border-subtle)] bg-[var(--bg-surface)] hover:border-[var(--brand-primary)] text-[var(--text-primary)] font-medium text-sm flex items-center justify-center space-x-2 transition-all shadow-sm" onclick="location.reload()">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                    <span class="font-display">New Workspace</span>
                </button>
            </div>

            <!-- Empty History State -->
            <div class="flex-1 flex flex-col px-5 py-3 min-w-[260px]">
                <p class="text-[10px] font-bold text-[var(--text-tertiary)] uppercase tracking-widest mb-3">Today</p>
                <div class="text-xs text-[var(--text-secondary)] italic flex items-center">
                    <span class="w-1.5 h-1.5 rounded-full bg-[var(--border-highlight)] mr-2"></span>
                    Architecture session initiated.
                </div>
            </div>

            <!-- Sidebar Footer -->
            <div class="p-4 border-t border-[var(--border-subtle)] min-w-[260px]">
                <div class="flex items-center justify-between p-2 rounded-xl hover:bg-[var(--bg-elevated)] transition-colors cursor-pointer group">
                    <div class="flex items-center space-x-3">
                        <div class="w-8 h-8 rounded-full bg-[var(--text-primary)] flex items-center justify-center shadow-sm">
                            <span class="text-xs font-bold text-[var(--bg-base)]">U</span>
                        </div>
                        <span class="text-sm font-medium text-[var(--text-primary)] font-display">Developer</span>
                    </div>
                    <button onclick="toggleTheme(event)" class="text-[var(--text-tertiary)] hover:text-[var(--brand-primary)] transition-colors p-1" title="Toggle Theme">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
                    </button>
                </div>
            </div>
        </aside>

        <!-- Mobile Overlay -->
        <div id="sidebar-overlay" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-30 hidden md:hidden transition-opacity" onclick="document.getElementById('sidebar').classList.remove('open'); this.classList.add('hidden')"></div>

        <!-- Main Content -->
        <main id="main-content">
            
            <header class="h-16 flex items-center justify-between px-4 sm:px-6 glass-header absolute top-0 w-full">
                <div class="flex items-center space-x-3">
                    <button id="sidebar-toggle-btn" class="hidden md:block p-1.5 text-[var(--text-secondary)] hover:text-[var(--brand-primary)] transition-colors rounded-md hover:bg-[var(--bg-elevated)]" onclick="toggleDesktopSidebar()" title="Open Sidebar" style="display: none;">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
                    </button>
                    <button class="md:hidden text-[var(--text-secondary)] hover:text-[var(--brand-primary)] transition-colors" onclick="document.getElementById('sidebar').classList.add('open'); document.getElementById('sidebar-overlay').classList.remove('hidden')">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
                    </button>
                    <div class="flex items-center text-sm font-medium text-[var(--text-secondary)]">
                        <span class="hidden sm:inline">Workspace</span>
                        <span class="hidden sm:inline mx-2 text-[var(--border-highlight)]">/</span>
                        <span class="text-[var(--text-primary)] font-display font-medium">Architecture Canvas</span>
                    </div>
                </div>
                <div class="flex items-center px-3 py-1.5 rounded-full border border-[var(--border-subtle)] bg-[var(--bg-surface)] shadow-sm">
                    <span class="w-2 h-2 rounded-full bg-[var(--brand-accent)] mr-2 animate-pulse"></span>
                    <span class="text-[10px] font-bold uppercase tracking-widest text-[var(--text-secondary)]">VilotNI 1.5</span>
                </div>
            </header>

            <!-- Scrollable Chat Area -->
            <div class="flex-1 overflow-y-auto px-4 sm:px-6 pt-24 pb-40 flex flex-col relative z-10" id="chat-scroll-area">
                
                <!-- Chat History Container -->
                <div id="chat-history" class="w-full max-w-3xl mx-auto flex flex-col space-y-8 hidden pb-4">
                    <!-- Messages will be injected here -->
                </div>

                <!-- Empty State / Welcome -->
                <div class="max-w-2xl mx-auto w-full flex-1 flex flex-col justify-center animate-fade-in" id="empty-state">
                    <div class="mb-10 text-center sm:text-left">
                        <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-[var(--bg-surface)] border border-[var(--border-subtle)] mb-6 shadow-sm text-[var(--brand-primary)]">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
                                <path d="M2 17L12 22L22 17" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
                                <path d="M2 12L12 17L22 12" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
                            </svg>
                        </div>
                        <h2 class="text-4xl sm:text-5xl font-display font-bold mb-4 tracking-tight text-[var(--text-primary)]">What are we building?</h2>
                        <p class="text-lg text-[var(--text-secondary)] font-light leading-relaxed">
                            Describe your UI logic. VilotNI 1.5 will synthesize the structural concepts and generate semantic architecture.
                        </p>
                    </div>

                    <!-- Suggestion Cards -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 w-full">
                        <button class="suggestion-card p-5 rounded-2xl text-left flex flex-col space-y-2 group" onclick="window.fillInput('Can you make me a user profile card and add a dark mode navbar aswell?')">
                            <span class="font-display font-semibold text-base text-[var(--text-primary)] flex items-center group-hover:text-[var(--brand-primary)] transition-colors">
                                <svg class="w-5 h-5 mr-2 text-[var(--brand-primary)]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 10l-2 1m0 0l-2-1m2 1v2.5M20 7l-2 1m2-1l-2-1m2 1v2.5M14 4l-2-1-2 1M4 7l2-1M4 7l2 1M4 7v2.5M12 21l-2-1m2 1l2-1m-2 1v-2.5M6 18l-2-1v-2.5M18 18l2-1v-2.5"/></svg>
                                Logic Mixing
                            </span>
                            <span class="text-sm text-[var(--text-secondary)] leading-relaxed font-light">Synthesize a dark mode navbar directly onto a user profile card layout.</span>
                        </button>
                        
                        <button class="suggestion-card p-5 rounded-2xl text-left flex flex-col space-y-2 group" onclick="window.fillInput('What is your neural architecture and how do you process data?')">
                            <span class="font-display font-semibold text-base text-[var(--text-primary)] flex items-center group-hover:text-[var(--brand-secondary)] transition-colors">
                                <svg class="w-5 h-5 mr-2 text-[var(--brand-secondary)]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
                                Test Cognitive Engine
                            </span>
                            <span class="text-sm text-[var(--text-secondary)] leading-relaxed font-light">Ask the AI about its heuristic evaluation and internal logic structures.</span>
                        </button>

                        <button class="suggestion-card p-5 rounded-2xl text-left flex flex-col space-y-2 group" onclick="window.fillInput('Generate a clean authentication flow with Login and Sign Up forms.')">
                            <span class="font-display font-semibold text-base text-[var(--text-primary)] flex items-center group-hover:text-emerald-500 transition-colors">
                                <svg class="w-5 h-5 mr-2 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                                Auth Forms
                            </span>
                            <span class="text-sm text-[var(--text-secondary)] leading-relaxed font-light">Construct a split-layout authentication flow for secure access.</span>
                        </button>

                        <button class="suggestion-card p-5 rounded-2xl text-left flex flex-col space-y-2 group" onclick="window.fillInput('Build a responsive bento box layout.')">
                            <span class="font-display font-semibold text-base text-[var(--text-primary)] flex items-center group-hover:text-[var(--brand-accent)] transition-colors">
                                <svg class="w-5 h-5 mr-2 text-[var(--brand-accent)]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" /></svg>
                                Modern Grids
                            </span>
                            <span class="text-sm text-[var(--text-secondary)] leading-relaxed font-light">Deploy a responsive, multi-span CSS Grid component commonly used in dashboards.</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Fixed Input Bar -->
            <div class="absolute bottom-0 w-full bg-gradient-to-t from-[var(--bg-base)] via-[var(--bg-base)] to-transparent pt-12 pb-8 px-4 sm:px-6 z-20">
                <div class="max-w-3xl mx-auto relative">
                    <div class="input-box p-2 flex items-end relative backdrop-blur-xl bg-[var(--bg-surface)]/90">
                        
                        <button class="p-2.5 rounded-full hover:bg-[var(--bg-elevated)] text-[var(--text-tertiary)] hover:text-[var(--brand-primary)] transition-colors mb-0.5 ml-0.5 shrink-0" title="Attach context">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"/></svg>
                        </button>

                        <textarea 
                            id="user-input" 
                            rows="1" 
                            class="w-full bg-transparent border-0 focus:ring-0 p-3 text-[15px] placeholder:text-[var(--text-tertiary)] mx-1 leading-relaxed text-[var(--text-primary)]" 
                            placeholder="Ask VilotNI 1.5 to generate architecture..."
                        ></textarea>
                        
                        <button id="submit-btn" class="mb-1.5 mr-1.5 p-2.5 rounded-full bg-[var(--bg-elevated)] text-[var(--text-tertiary)] transition-all duration-300 flex items-center justify-center pointer-events-none shrink-0" onclick="window.handleSend()">
                            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M3.478 2.405a.75.75 0 00-.926.94l2.432 7.905H13.5a.75.75 0 010 1.5H4.984l-2.432 7.905a.75.75 0 00.926.94 60.519 60.519 0 0018.445-8.986.75.75 0 000-1.218A60.517 60.517 0 003.478 2.405z"/></svg>
                        </button>
                    </div>
                    
                    <div class="text-center mt-3 text-[11px] text-[var(--text-tertiary)] flex items-center justify-center space-x-2">
                        <span class="font-display">VilotGRI Engine v1.5</span>
                        <span>&bull;</span>
                        <span>Spirit-BFC & T1mothyXD</span>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Connects to your existing AI Logic Engine -->
    <script src="VilotNI_1.js"></script>

    <script>
        // ========================================================
        // UI & INTERACTION LOGIC
        // ========================================================
        const chatScrollArea = document.getElementById('chat-scroll-area');
        const chatHistory = document.getElementById('chat-history');
        const emptyState = document.getElementById('empty-state');
        const userInput = document.getElementById('user-input');
        const submitBtn = document.getElementById('submit-btn');
        const sidebar = document.getElementById('sidebar');
        const sidebarToggleBtn = document.getElementById('sidebar-toggle-btn');
        let isProcessing = false;

        function toggleTheme(e) {
            if(e) e.stopPropagation();
            document.body.classList.toggle('light-mode');
        }

        function toggleDesktopSidebar() {
            sidebar.classList.toggle('collapsed');
            if (sidebar.classList.contains('collapsed')) {
                sidebarToggleBtn.style.display = 'block';
            } else {
                sidebarToggleBtn.style.display = 'none';
            }
        }

        // Bound to window securely so HTML onclick can find it
        window.fillInput = function(text) {
            userInput.value = text;
            userInput.style.height = '';
            userInput.style.height = userInput.scrollHeight + 'px';
            window.toggleSubmitBtn(text);
            userInput.focus();
        };

        window.toggleSubmitBtn = function(val) {
            if (val.trim().length > 0 && !isProcessing) {
                submitBtn.classList.remove('bg-[var(--bg-elevated)]', 'text-[var(--text-tertiary)]', 'pointer-events-none');
                // Use brand gradient for active submit button
                submitBtn.style.background = 'var(--vilotni-gradient)';
                submitBtn.style.color = 'white';
                submitBtn.style.pointerEvents = 'auto';
                submitBtn.style.boxShadow = '0 4px 15px rgba(99, 102, 241, 0.4)';
            } else {
                submitBtn.classList.add('bg-[var(--bg-elevated)]', 'text-[var(--text-tertiary)]', 'pointer-events-none');
                submitBtn.style.background = '';
                submitBtn.style.color = '';
                submitBtn.style.boxShadow = '';
            }
        };

        window.copyCodeToClipboard = function(btn, encodedCode) {
            const textarea = document.createElement('textarea');
            textarea.value = decodeURIComponent(encodedCode);
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
            
            const originalText = btn.innerHTML;
            btn.innerHTML = '<span class="text-green-500 font-bold">Copied!</span>';
            setTimeout(() => {
                btn.innerHTML = originalText;
            }, 2000);
        };

        // --- Chat Submission Logic ---
        
        userInput.addEventListener('input', function() {
            this.style.height = '';
            this.style.height = this.scrollHeight + 'px';
            window.toggleSubmitBtn(this.value);
        });

        userInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                window.handleSend();
            }
        });

        window.handleSend = function() {
            const text = userInput.value.trim();
            if (!text || isProcessing) return;

            isProcessing = true;
            emptyState.style.display = 'none';
            chatHistory.classList.remove('hidden');
            
            appendUserMessage(text);
            
            userInput.value = '';
            userInput.style.height = 'auto';
            window.toggleSubmitBtn('');

            const indicatorId = appendTypingIndicator();

            setTimeout(() => {
                let response = null;
                try {
                    // Safe call to logic engine
                    response = typeof VilotNI !== 'undefined' ? VilotNI.process(text) : { type: 'chat', text: "Error: VilotNI_1.js logic engine could not be loaded." };
                } catch (err) {
                    console.error("VilotNI Engine Error:", err);
                    response = { type: 'chat', text: "Error: Syntax failure in VilotNI logic processing." };
                }

                removeTypingIndicator(indicatorId);
                appendAIMessage(response, text);
            }, 400); 
        };

        window.handleRegenerate = function(text, btnId) {
            const btn = document.getElementById(btnId);
            
            if (isProcessing) {
                const originalHTML = btn.innerHTML;
                btn.innerHTML = '<span class="text-[var(--brand-accent)] text-[10px] font-bold uppercase tracking-widest">Wait...</span>';
                setTimeout(() => { 
                    if (document.getElementById(btnId)) {
                        document.getElementById(btnId).innerHTML = originalHTML; 
                    }
                }, 2000);
                return;
            }
            
            isProcessing = true;
            window.toggleSubmitBtn('');
            
            const indicatorId = appendTypingIndicator();

            setTimeout(() => {
                let response = null;
                try {
                    response = typeof VilotNI !== 'undefined' ? VilotNI.process(text) : { type: 'chat', text: "Error: VilotNI_1.js missing." };
                } catch (err) {
                    console.error("VilotNI Engine Error:", err);
                    response = { type: 'chat', text: "Error: Syntax failure." };
                }

                removeTypingIndicator(indicatorId);
                appendAIMessage(response, text);
            }, 400);
        };

        function appendUserMessage(text) {
            const wrapper = document.createElement('div');
            wrapper.className = 'flex w-full justify-end animate-fade-in';
            
            const bubble = document.createElement('div');
            bubble.className = 'msg-user max-w-[85%] rounded-2xl px-5 py-3.5 text-[15px] leading-relaxed shadow-sm';
            bubble.innerText = text;
            bubble.innerHTML = bubble.innerHTML.replace(/\n/g, '<br>');
            
            wrapper.appendChild(bubble);
            chatHistory.appendChild(wrapper);
            scrollToBottom();
        }

        // ========================================================
        // DOM ELEMENT GENERATION (STRING CONCAT TO PREVENT ERRORS)
        // ========================================================

        function appendTypingIndicator() {
            const id = 'typing-' + Date.now();
            const wrapper = document.createElement('div');
            wrapper.id = id;
            wrapper.className = 'flex w-full justify-start animate-fade-in';
            
            let s = '<div class="flex space-x-4 max-w-full">';
            s += '<div class="w-8 h-8 rounded-xl bg-gradient-to-br from-[var(--brand-primary)] to-[var(--brand-secondary)] flex items-center justify-center shadow-lg mt-1 relative overflow-hidden ring-1 ring-white/10">';
            s += '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="white" stroke-width="2" stroke-linejoin="round"/><path d="M2 17L12 22L22 17" stroke="white" stroke-width="2" stroke-linejoin="round"/><path d="M2 12L12 17L22 12" stroke="white" stroke-width="2" stroke-linejoin="round"/></svg>';
            s += '</div>';
            s += '<div class="px-2 py-2 flex items-center typing-indicator h-10">';
            s += '<span></span><span></span><span></span>';
            s += '</div></div>';

            wrapper.innerHTML = s;
            chatHistory.appendChild(wrapper);
            scrollToBottom();
            return id;
        }

        function removeTypingIndicator(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }

        function highlightSyntax(code) {
            let escapedCode = code.replace(/</g, '&lt;').replace(/>/g, '&gt;');
            escapedCode = escapedCode.replace(/&lt;(\/?)([a-zA-Z0-9-]+)/g, '&lt;$1<span class="token-tag font-medium">$2</span>');
            escapedCode = escapedCode.replace(/([a-zA-Z0-9-]+)=/g, '<span class="token-attr">$1</span>=');
            escapedCode = escapedCode.replace(/(".*?")/g, '<span class="token-string">$1</span>');
            escapedCode = escapedCode.replace(/('.*?')/g, '<span class="token-string">$1</span>');
            return escapedCode;
        }

        async function typeWriterEffect(element, text) {
            if (!text) return;
            const formattedText = text.replace(/\*\*(.*?)\*\*/g, '<strong class="text-[var(--text-primary)] font-semibold">$1</strong>');
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = formattedText;
            
            for (const node of Array.from(tempDiv.childNodes)) {
                if (node.nodeType === Node.TEXT_NODE) {
                    const chars = node.textContent.split('');
                    for (const char of chars) {
                        element.innerHTML += char;
                        if(chatScrollArea.scrollHeight - chatScrollArea.scrollTop < 600) {
                            scrollToBottom();
                        }
                        await new Promise(r => setTimeout(r, 8));
                    }
                } else {
                    element.appendChild(node.cloneNode(true));
                    await new Promise(r => setTimeout(r, 8));
                }
            }
        }

        async function appendAIMessage(response, originalText = "") {
            const msgId = 'msg-' + Date.now();
            const wrapper = document.createElement('div');
            wrapper.className = 'flex w-full justify-start animate-fade-in mb-8 group/msg';
            
            let inner = '<div class="flex space-x-4 max-w-full w-full">';
            
            // Avatar & Thinking Ring
            inner += '<div class="relative w-8 h-8 shrink-0 mt-1">';
            inner += '<svg class="absolute inset-[-6px] w-11 h-11 -rotate-90 z-20 pointer-events-none" viewBox="0 0 36 36">';
            inner += '<circle cx="18" cy="18" r="16" fill="none" stroke="transparent" stroke-width="2"></circle>';
            // Uses brand-primary for the loading ring
            inner += '<circle id="ring-' + msgId + '" cx="18" cy="18" r="16" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="100" stroke-dashoffset="100" class="text-[var(--brand-primary)] transition-all duration-700 ease-out"></circle>';
            inner += '</svg>';
            inner += '<div class="w-full h-full rounded-xl bg-gradient-to-br from-[var(--brand-primary)] to-[var(--brand-secondary)] flex items-center justify-center relative z-10 shadow-lg ring-1 ring-white/10">';
            inner += '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="white" stroke-width="2" stroke-linejoin="round"/><path d="M2 17L12 22L22 17" stroke="white" stroke-width="2" stroke-linejoin="round"/><path d="M2 12L12 17L22 12" stroke="white" stroke-width="2" stroke-linejoin="round"/></svg>';
            inner += '</div></div>';
            
            // Chat Text Container
            inner += '<div class="w-full overflow-hidden">';
            
            // Refined Premium Header
            inner += '<div class="flex flex-col sm:flex-row sm:items-center mb-3 space-y-2 sm:space-y-0 sm:space-x-3">';
            inner += '<div class="flex items-center space-x-2">';
            inner += '<span class="text-[14px] font-display font-bold text-[var(--text-primary)] tracking-wide">VilotNI 1.5</span>';
            inner += '<span class="text-[9px] font-bold uppercase tracking-widest text-[var(--brand-primary)] bg-[var(--brand-primary)]/10 px-2 py-0.5 rounded-full border border-[var(--brand-primary)]/20 shadow-sm">AI Logic</span>';
            inner += '</div>';
            
            // Process Badge
            inner += '<div id="process-badge-' + msgId + '" class="px-2.5 py-1 rounded-md bg-[var(--bg-base)] border border-[var(--border-subtle)] flex items-center shadow-inner transition-all duration-300 w-fit">';
            inner += '<span id="process-text-' + msgId + '" class="text-[11px] font-mono text-[var(--text-secondary)] whitespace-nowrap flex items-center gap-1.5">';
            inner += '<span class="w-1.5 h-1.5 rounded-full bg-[var(--brand-primary)] animate-pulse"></span>Initializing Engine...';
            inner += '</span></div></div>';

            // Text and Code Dynamic Divs
            inner += '<div id="text-' + msgId + '" class="leading-[1.7] text-[15px] min-h-[20px] space-y-4 text-[var(--text-primary)] font-normal"></div>';
            inner += '<div id="code-' + msgId + '" class="hidden opacity-0 translate-y-4 transition-all duration-700 ease-out w-full max-w-full mt-4"></div>';
            
            // Premium Hover Action Toolbar
            inner += '<div id="action-' + msgId + '" class="mt-4 flex items-center space-x-2 opacity-0 group-hover/msg:opacity-100 transition-opacity duration-300 hidden">';
            inner += '<button id="regen-btn-' + msgId + '" class="flex items-center justify-center space-x-1.5 px-3 py-1.5 rounded-lg border border-[var(--border-subtle)] bg-[var(--bg-base)] text-[11px] font-bold uppercase tracking-widest text-[var(--text-tertiary)] hover:text-[var(--brand-primary)] hover:border-[var(--brand-primary)] transition-all shadow-sm group">';
            inner += '<svg class="w-3.5 h-3.5 group-hover:rotate-180 transition-transform duration-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>';
            inner += '<span>Regenerate</span></button>';
            inner += '<button id="copy-btn-' + msgId + '" class="flex items-center justify-center space-x-1.5 px-3 py-1.5 rounded-lg border border-[var(--border-subtle)] bg-[var(--bg-base)] text-[11px] font-bold uppercase tracking-widest text-[var(--text-tertiary)] hover:text-[var(--brand-secondary)] hover:border-[var(--brand-secondary)] transition-all shadow-sm">';
            inner += '<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>';
            inner += '<span>Copy Text</span></button>';
            inner += '</div></div></div>';
            
            wrapper.innerHTML = inner;
            chatHistory.appendChild(wrapper);
            scrollToBottom();

            // Securely attach event listeners
            const regenBtn = document.getElementById('regen-btn-' + msgId);
            if (regenBtn) {
                regenBtn.addEventListener('click', () => {
                    window.handleRegenerate(originalText, 'regen-btn-' + msgId);
                });
            }

            const copyTextBtn = document.getElementById('copy-btn-' + msgId);
            if (copyTextBtn) {
                copyTextBtn.addEventListener('click', () => {
                    const textContent = document.getElementById('text-' + msgId).innerText;
                    navigator.clipboard.writeText(textContent);
                    const originalBtnHtml = copyTextBtn.innerHTML;
                    copyTextBtn.innerHTML = '<span class="text-green-500">COPIED!</span>';
                    setTimeout(() => { copyTextBtn.innerHTML = originalBtnHtml; }, 2000);
                });
            }

            // ---------------------------------------------------------
            // RUN THE COGNITIVE ANIMATION SEQUENCE
            // ---------------------------------------------------------
            const ring = document.getElementById('ring-' + msgId);
            const processText = document.getElementById('process-text-' + msgId);
            const textContainer = document.getElementById('text-' + msgId);
            const codeContainer = document.getElementById('code-' + msgId);
            const actionBar = document.getElementById('action-' + msgId);

            if (!response.thinking) {
                response.thinking = { intent: "General Request", concepts: "None", confidence: 1.0 };
            }

            // Step 1: Intent
            await new Promise(r => setTimeout(r, 200));
            ring.style.strokeDashoffset = '66';
            processText.innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-[var(--brand-primary)] animate-pulse"></span><span class="text-[var(--brand-primary)] font-bold ml-1.5">Intent:</span> <span class="ml-1">' + response.thinking.intent + '</span>';
            scrollToBottom();

            // Step 2: Concepts
            await new Promise(r => setTimeout(r, 500));
            ring.style.strokeDashoffset = '33';
            processText.innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-[var(--brand-secondary)] animate-pulse"></span><span class="text-[var(--brand-secondary)] font-bold ml-1.5">Concepts:</span> <span class="ml-1 truncate max-w-[150px]" title="' + response.thinking.concepts + '">[' + response.thinking.concepts + ']</span>';
            
            // Step 3: Confidence
            await new Promise(r => setTimeout(r, 500));
            ring.style.strokeDashoffset = '0';
            const confVal = (response.thinking.confidence * 100).toFixed(1);
            const confColor = response.thinking.confidence > 0.6 ? 'text-emerald-400' : 'text-[var(--brand-accent)]';
            const dotColor = response.thinking.confidence > 0.6 ? 'bg-emerald-400' : 'bg-[var(--brand-accent)]';
            processText.innerHTML = '<span class="w-1.5 h-1.5 rounded-full ' + dotColor + ' animate-pulse"></span><span class="font-bold ml-1.5">Confidence:</span> <span class="' + confColor + ' ml-1">' + confVal + '%</span>';

            // Finish Processing
            await new Promise(r => setTimeout(r, 500));
            ring.classList.replace('text-[var(--brand-primary)]', 'text-[var(--border-highlight)]');
            processText.innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-[var(--text-secondary)]"></span><span class="font-bold uppercase tracking-widest text-[9px] text-[var(--text-secondary)] ml-1.5">Analysis Complete</span>';

            isProcessing = false;

            // ---------------------------------------------------------
            // START TEXT GENERATION
            // ---------------------------------------------------------
            await typeWriterEffect(textContainer, response.text);
            actionBar.classList.remove('hidden');

            if (response.type === 'code' && response.code) {
                const generatedTitle = response.title || 'VilotGRI Architecture';
                
                // Extremely safe script string construction array join method
                const fullHTMLCode = [
                    '<!DOCTYPE html>',
                    '<html lang="en">',
                    '<head>',
                    '    <meta charset="UTF-8">',
                    '    <meta name="viewport" content="width=device-width, initial-scale=1.0">',
                    '    <title>' + generatedTitle + '</title>',
                    '    <script src="https://cdn.tailwindcss.com"><' + '/script>',
                    '</head>',
                    '<body>',
                    response.code,
                    '</body>',
                    '</html>'
                ].join('\n');

                const highlightedCode = highlightSyntax(fullHTMLCode); 
                
                let codeInner = '<div class="code-window max-w-full group/code">';
                codeInner += '<div class="code-header">';
                codeInner += '<div class="flex items-center space-x-2.5 px-2.5 py-1.5 bg-[#18181b] rounded-md border border-[var(--border-highlight)]">';
                codeInner += '<svg class="w-3.5 h-3.5 text-[var(--brand-accent)]" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><path d="M14 2v6h6"></path><path d="m10 13-2 2 2 2"></path><path d="m14 17 2-2-2-2"></path></svg>';
                codeInner += '<span class="text-[11px] font-mono text-gray-300 font-medium">index.html</span>';
                codeInner += '</div>';
                codeInner += '<button id="copy-code-btn-' + msgId + '" class="flex items-center space-x-1.5 text-xs font-bold uppercase tracking-wider text-[var(--text-tertiary)] hover:text-[var(--text-primary)] transition-colors bg-transparent hover:bg-[var(--bg-elevated)] border border-transparent hover:border-[var(--border-subtle)] px-3 py-1.5 rounded-md">';
                codeInner += '<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>';
                codeInner += '<span>Copy</span>';
                codeInner += '</button>';
                codeInner += '</div>';
                codeInner += '<div class="code-content font-mono">';
                codeInner += '<pre><code>' + highlightedCode + '</code></pre>';
                codeInner += '</div></div>';
                
                codeContainer.innerHTML = codeInner;

                // Safely attach copy code listener without inline HTML evaluation
                const copyCodeBtn = document.getElementById('copy-code-btn-' + msgId);
                if (copyCodeBtn) {
                    copyCodeBtn.addEventListener('click', function() {
                        const encoded = encodeURIComponent(fullHTMLCode);
                        window.copyCodeToClipboard(this, encoded);
                    });
                }
                
                codeContainer.classList.remove('hidden');
                setTimeout(() => {
                    codeContainer.classList.remove('opacity-0', 'translate-y-4');
                    scrollToBottom();
                }, 50);
            }
        }

        function scrollToBottom() {
            chatScrollArea.scrollTo({
                top: chatScrollArea.scrollHeight,
                behavior: 'smooth'
            });
        }
    </script>
</body>
</html>
